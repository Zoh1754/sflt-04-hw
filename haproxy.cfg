global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http_frontend
    bind *:80
    default_backend web_target_group

backend web_target_group
    balance roundrobin

    option httpchk GET /
    http-check expect status 200

    server web-1 web-1:80 check inter 2s fall 2 rise 2
    server web-2 web-2:80 check inter 2s fall 2 rise 2

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
